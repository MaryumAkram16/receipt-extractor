name: Verify Receipt Extractor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app evals
      - run: docker build -t receipt-extractor:ci .
      - name: Start API
        env:
          LLM_STUB: '1'
        run: uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/receipt-api.log 2>&1 &
      - name: Wait for API
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/docs >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/receipt-api.log
          exit 1
      - name: Run deterministic schema smoke test
        env:
          LLM_STUB: '1'
        run: |
          response=$(curl --fail --silent -X POST http://127.0.0.1:8000/extract \
            -H 'Content-Type: application/json' \
            -d '{"text":"Cafe Aroma\\nTotal: PKR 1082"}')
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert set(["vendor","date","total_amount","currency","confidence","needs_review"]).issubset(d); print(json.dumps(d, indent=2))' "$response"
      - name: Run labelled evaluation when provider credentials are available
        if: ${{ secrets.LLM_API_KEY != '' }}
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python -m evals.run_eval --base-url http://127.0.0.1:8000
