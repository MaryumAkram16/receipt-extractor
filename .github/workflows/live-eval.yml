# Real-model evaluation against the labelled cases in evals/cases.json.
#
# DISABLED BY DEFAULT. It runs only when BOTH are true:
#   1. someone starts it manually (Actions -> Live LLM evaluation -> Run workflow), and
#   2. the repository variable ENABLE_LIVE_EVAL is set to "true"
#      (Settings -> Secrets and variables -> Actions -> Variables),
# and it additionally needs the LLM_API_KEY secret. It never runs on pull
# requests or pushes, so normal CI never makes paid/quota-limited calls.
#
# The API is started with LLM_STUB=0 explicitly, and the evaluator refuses
# to score unless GET /health reports llm_mode == "live".
name: Live LLM evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-eval
  cancel-in-progress: false

jobs:
  live-eval:
    # Explicit opt-in switch; without it the job is skipped and no secret is read.
    if: ${{ vars.ENABLE_LIVE_EVAL == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check provider credentials
        id: creds
        env:
          # Evaluates to the string "true"/"false"; the secret value itself
          # is never placed in this step's environment.
          HAS_KEY: ${{ secrets.LLM_API_KEY != '' }}
        run: echo "available=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - name: Skip notice
        if: steps.creds.outputs.available != 'true'
        run: echo "::notice::LLM_API_KEY secret is not configured; live evaluation skipped."

      - uses: actions/checkout@v4
        if: steps.creds.outputs.available == 'true'
      - uses: actions/setup-python@v5
        if: steps.creds.outputs.available == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - if: steps.creds.outputs.available == 'true'
        run: python -m pip install -r requirements.txt

      - name: Start API (live mode)
        if: steps.creds.outputs.available == 'true'
        env:
          LLM_STUB: '0'
          LLM_ENABLED: 'true'
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'openrouter/free' }}
        run: uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/receipt-api.log 2>&1 &

      - name: Wait for API
        if: steps.creds.outputs.available == 'true'
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then echo; exit 0; fi
            sleep 1
          done
          echo "API did not become healthy" >&2
          exit 1

      - name: Labelled evaluation (refuses to run against stub responses)
        if: steps.creds.outputs.available == 'true'
        run: python -m evals.run_eval --mode labelled --require-llm-mode live

      - name: Upload evaluation report
        # reports/eval-YYYY-MM-DD.md is git-ignored, so keep it as a run artifact.
        if: always() && steps.creds.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/eval-*.md
          if-no-files-found: ignore

      - name: Show API log
        # The app never logs the API key, request headers or receipt text;
        # GitHub additionally masks secret values in all log output.
        if: failure() && steps.creds.outputs.available == 'true'
        run: cat /tmp/receipt-api.log
